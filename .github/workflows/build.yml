name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  platformio:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
          

      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio

      - name: Build firmware
        run: pio run -e nodemcuv2

      - name: Build LittleFS
        run: pio run -e nodemcuv2 --target buildfs

      - name: Collect build files
        run: |
          mkdir -p dist
          cp .pio/build/nodemcuv2/firmware.bin dist/Spa_Control_firmware.bin
          cp .pio/build/nodemcuv2/littlefs.bin dist/Spa_Control_littlefs.bin
          sha256sum dist/*.bin > dist/SHA256SUMS.txt

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Spa-Control-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
