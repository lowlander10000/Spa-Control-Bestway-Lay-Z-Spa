name: Build and publish release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
          key: ${{ runner.os }}-pio-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-

      - name: Install PlatformIO Core
        run: python -m pip install --upgrade platformio

      - name: Read project version
        id: version
        shell: bash
        run: |
          VERSION="$(tr -d '\r\n' < VERSION)"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build firmware
        run: pio run -e nodemcuv2

      - name: Build LittleFS image
        run: pio run -e nodemcuv2 -t buildfs

      - name: Prepare release assets
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          mkdir -p release
          cp .pio/build/nodemcuv2/firmware.bin "release/Spa_Control_v${VERSION}_firmware.bin"
          cp .pio/build/nodemcuv2/littlefs.bin "release/Spa_Control_v${VERSION}_littlefs.bin"
          zip -r "release/Spa_Control_v${VERSION}_FULL.zip" . \
            -x '.git/*' '.pio/*' 'release/*'
          cd release
          sha256sum *.bin *.zip > SHA256SUMS.txt

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Spa-Control-${{ github.ref_name }}
          path: release/*

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          NOTES="RELEASE_NOTES_V${VERSION}.md"
          if [ ! -f "$NOTES" ]; then
            NOTES="CHANGELOG.md"
          fi
          gh release create "${GITHUB_REF_NAME}" \
            "release/Spa_Control_v${VERSION}_firmware.bin" \
            "release/Spa_Control_v${VERSION}_littlefs.bin" \
            "release/Spa_Control_v${VERSION}_FULL.zip" \
            release/SHA256SUMS.txt \
            --title "Spa Control v${VERSION}" \
            --notes-file "$NOTES" \
            --verify-tag
