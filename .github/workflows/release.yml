name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
          cache: pip

      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio

      - name: Build firmware
        run: pio run -e nodemcuv2

      - name: Build LittleFS
        run: pio run -e nodemcuv2 --target buildfs

      - name: Prepare release assets
        shell: bash
        run: |
          mkdir -p dist
          VERSION="${GITHUB_REF_NAME#v}"
          cp .pio/build/nodemcuv2/firmware.bin "dist/Spa_Control_v${VERSION}_firmware.bin"
          cp .pio/build/nodemcuv2/littlefs.bin "dist/Spa_Control_v${VERSION}_littlefs.bin"
          sha256sum dist/*.bin > dist/SHA256SUMS.txt

      - name: Create GitHub release and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME"             dist/*             --title "Spa Control $GITHUB_REF_NAME"             --generate-notes
