name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio

      - name: Build firmware
        run: pio run -e nodemcuv2

      - name: Build LittleFS
        run: pio run -e nodemcuv2 --target buildfs

      - name: Prepare release assets
        shell: bash
        run: |
          mkdir -p dist
          VERSION="${GITHUB_REF_NAME#v}"
          cp .pio/build/nodemcuv2/firmware.bin "dist/Spa_Control_v${VERSION}_firmware.bin"
          cp .pio/build/nodemcuv2/littlefs.bin "dist/Spa_Control_v${VERSION}_littlefs.bin"
          sha256sum dist/*.bin > dist/SHA256SUMS.txt

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release bestaat al; assets worden toegevoegd."
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            echo "Nieuwe release wordt aangemaakt."
            gh release create "$GITHUB_REF_NAME" \
              dist/* \
              --title "Spa Control $GITHUB_REF_NAME" \
              --generate-notes
          fi
