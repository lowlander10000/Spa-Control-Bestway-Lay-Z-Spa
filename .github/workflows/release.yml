name: Build and publish release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
          key: ${{ runner.os }}-pio-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-

      - name: Install PlatformIO Core
        run: python -m pip install --upgrade platformio

      - name: Build firmware
        run: pio run -e nodemcuv2

      - name: Build LittleFS image
        run: pio run -e nodemcuv2 -t buildfs

      - name: Prepare release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          cp .pio/build/nodemcuv2/firmware.bin release/Spa_Control_v3.2.0_firmware.bin
          cp .pio/build/nodemcuv2/littlefs.bin release/Spa_Control_v3.2.0_littlefs.bin
          zip -r release/Spa_Control_v3.2.0_FULL.zip . \
            -x '.git/*' '.pio/*' 'release/*'
          cd release
          sha256sum *.bin *.zip > SHA256SUMS.txt

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Spa-Control-${{ github.ref_name }}
          path: release/*

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            release/Spa_Control_v3.2.0_firmware.bin \
            release/Spa_Control_v3.2.0_littlefs.bin \
            release/Spa_Control_v3.2.0_FULL.zip \
            release/SHA256SUMS.txt \
            --title "Spa Control v3.2.0" \
            --notes-file RELEASE_NOTES_V3.2.0.md \
            --verify-tag
