<div class="dashboard-layout">
  <div>
    <div class="temperature-card">
      <p>Huidige temperatuur</p>
      <h2><span id="temperature">--</span>°C</h2>
      <span>Doeltemperatuur <b id="target">--</b>°C</span>
    </div>

    <div class="mini-card">
      <div class="info-row"><span>WiFi</span><b id="wifiIndicator" class="indicator bad">--</b></div>
      <div class="info-row"><span>MQTT</span><b id="mqttIndicator" class="indicator bad">--</b></div>
      <div class="info-row"><span>IP</span><b id="ip">--</b></div>
    </div>
  </div>

  <div class="grid">
    <div class="quick-tile" id="heaterTile">🔥<small>Verwarming</small></div>
    <div class="quick-tile" id="filterTile">💧<small>Filter</small></div>
    <div class="quick-tile" id="bubblesTile">🫧<small>Bubbels</small></div>
    <div class="quick-tile" id="jetsTile">🌊<small>Jets</small></div>
  </div>
</div>
